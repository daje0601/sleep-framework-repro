name: CPU correctness

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CPU dependencies and project
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch==2.15.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Run offline CPU suite
        run: python -m pytest
      - name: Exercise synthetic integration CLI
        run: sleep-repro smoke --output runs/ci-smoke
      - name: Build source and wheel distributions
        run: python -m build
      - name: Upload CPU evidence and distributions
        uses: actions/upload-artifact@v4
        with:
          name: cpu-evidence-and-distributions
          path: |
            runs/ci-smoke/smoke.json
            dist/*
